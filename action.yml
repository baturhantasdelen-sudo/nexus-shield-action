name: Nexus Shield Security Gatekeeper
description: Edge-speed PII & Secret leak detection for PRs and CI/CD pipelines
author: baturhantasdelen-sudo
branding:
  icon: shield
  color: blue

inputs:
  github-token:
    description: GitHub Token for reading diffs and posting PR comments
    required: true
    default: ${{ github.token }}
  nexus-api-key:
    description: Optional API Key to log anonymous leak stats to your Nexus Shield Dashboard
    required: false
    default: ''
  fail-on-detection:
    description: Whether to fail the workflow step when leaks are detected
    required: false
    default: 'true'

runs:
  using: node24
  main: dist/index.js
