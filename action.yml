name: Nexus Shield Security Gatekeeper
description: Edge-speed PII & Secret leak detection for PRs
author: Nexus Shield Team
branding:
  icon: shield
  color: blue

inputs:
  github-token:
    description: GitHub token for API access and PR comments
    required: true
    default: ${{ github.token }}
  fail-on-detection:
    description: Fail the workflow when PII or secrets are detected
    required: false
    default: "true"

runs:
  using: node24
  main: dist/index.js
