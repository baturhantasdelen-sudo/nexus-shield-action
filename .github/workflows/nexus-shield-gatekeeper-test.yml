name: Nexus Shield Gatekeeper Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Nexus Shield Security Scan
        uses: ./
        with:
          api_key: ${{ secrets.NEXUS_SHIELD_API_KEY }}
          profile: TR
          policy_file: .nexus-shield.yml
